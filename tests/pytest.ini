[pytest]
# Run from the repository root: HERMES_AGENT_DIR=/path/to/hermes-agent <hermes-venv>/bin/python -m pytest tests
markers =
    integration: native lane; starts real desktops, scopes or guests (opt in with -m integration)
    linux_only: exercises Linux-specific behaviour; skipped on other hosts
    macos_only: exercises macOS-specific behaviour; skipped on other hosts
    windows_only: exercises native-Windows behaviour; skipped on other hosts
addopts = -m "not integration" -p no:cacheprovider
