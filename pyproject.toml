[build-system]
requires = ["setuptools>=77.0.3,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-realms"
version = "0.1.0"
description = "Per-session headless desktops for Hermes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "fastapi>=0.115,<0.135", "uvicorn>=0.35.0,<0.43", "websockets>=14,<16"]

[project.scripts]
hermes-realm = "realms.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["realms*"]

[tool.setuptools.package-data]
realms = ["web/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["e2e: requires a Linux systemd user session and wlroots tools"]
