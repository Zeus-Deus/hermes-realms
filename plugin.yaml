name: hermes-realms
version: 0.2.0
kind: standalone
description: Profile-scoped private Linux desktops for Hermes conversations
requires_hermes: ">=0.22"
platforms:
  - linux
python_dependencies:
  - "fastapi>=0.115,<1"
  - "uvicorn>=0.35.0,<1"
  - "websockets>=14,<16"
  - "PyYAML>=6,<7"
setup:
  entrypoint: setup.py
provides_tools:
  - realm
provides_hooks:
  - pre_tool_call
  - on_session_identity
  - on_session_start
  - on_session_finalize
  - on_session_reset
  - on_session_idle
provides_middleware:
  - tool_execution
